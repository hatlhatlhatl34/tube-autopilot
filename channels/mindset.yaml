# Zenith Mindset — daily motivational Shorts (evergreen + trend-flavored themes)
display_name: "Zenith Mindset"
niche: motivation

# ── VOICE (v3: the engine ladder — forever-factory doctrine) ────────
# PRIMARY: Kokoro-82M, vendored in assets/voice_kokoro/ — fully local
# offline neural TTS (MIT). No API, no key, no network: the voice
# cannot go dark while the repo exists. Per-video speed jitter is
# automatic. FALLBACK: edge-tts (free, keyless) if the model files
# are ever missing — set allow_edge_fallback: false for strictly
# offline runs. voice_engine: auto | kokoro | edge
voice_engine: "auto"
kokoro_voice: "am_michael"
kokoro_speed: 0.97
voice: "en-US-GuyNeural"                # edge-tts fallback persona
voice_rate: "-3%"
allow_edge_fallback: true

category_id: "22"            # People & Blogs
visibility: "public"         # public | private (private = review before publishing)
caption_font: "Anton"
caption_size: 96
mood: "epic"
trends:
  mode: "theme"              # evergreen daily theme, flavored with trending words when available
  google_news_queries: ["self improvement", "success mindset"]
  max_headlines: 3
palette:
  bg_top: "#060a16"
  bg_mid: "#13204d"
  bg_bottom: "#1d2f63"
  accent: "#f6c453"
  text: "#ffffff"
bokeh: 30
engagement_question: "Which one hit hardest? Tell me in the comments."
links: []                    # add affiliate/book links here later: [{label: ..., url: ...}]
affiliate: false
hashtags: ["#motivation", "#mindset", "#discipline", "#success", "#selfimprovement", "#shorts"]
music_mood: "epic"
description_cta: "Subscribe for your daily dose of discipline and an unstoppable mindset."
cross_promo: "More daily value on our network: @FactVaultHD | @AIChronicleNow | @WealthSignalsHQ"
daily_uploads: 5             # GROWTH MODE (2026-11-05): Zenith has its OWN
                             # GCP project = its own 10,000 quota units/day.
                             # 5 uploads (4 Shorts + 1 long-form) = 8,250
                             # units — comfortably inside the cap, and the
                             # local quota ledger still guards the rest.
longform_slot: 5             # the day's 5th upload = the 16:9 long-form
                             # (in grid mode the 20:00 long slot decides)
schedule:                    # publishAt grid — the OWNER'S CONTRACT, the
                             # unlocked forever-factory system (2026-11-05):
                             # videos are generated + uploaded PRIVATE and
                             # flip public automatically at these times.
                             # PUBLIC times are fixed; when the machine
                             # runs is flexible (it fills free slots).
                             # tools/gate.py freezes a copy of this grid
                             # (it runs before pip install) — keep in sync.
  timezone: "Africa/Cairo"
  short_slots: ["00:00", "06:00", "12:00", "18:00"]
  long_slots: ["20:00"]

title_patterns:
  - "{author} Understood This Early"
  - "The {theme} Rule Nobody Taught You"
  - "{author} On What Really Builds Success"
  - "Read This If You Feel Stuck In Life"
