# Fact Vault — mind-blowing facts Shorts, themed on daily Google trending searches
display_name: "Fact Vault"
niche: facts

# ── VOICE (v3: the engine ladder — forever-factory doctrine) ────────
# PRIMARY: Kokoro-82M, vendored in assets/voice_kokoro/ — fully local
# offline neural TTS (MIT). No API, no key, no network: the voice
# cannot go dark while the repo exists. Per-video speed jitter is
# automatic. FALLBACK: edge-tts (free, keyless) if the model files
# are ever missing — set allow_edge_fallback: false for strictly
# offline runs. voice_engine: auto | kokoro | edge
voice_engine: "auto"
kokoro_voice: "af_bella"
kokoro_speed: 1.02
voice: "en-US-AriaNeural"                # edge-tts fallback persona
voice_rate: "+8%"
allow_edge_fallback: true

category_id: "27"            # Education
visibility: "public"
caption_font: "Anton"
caption_size: 92
mood: "curious"
trends:
  mode: "trends"             # pick one daily trending search, serve themed facts
  geo: "US"
  google_news_queries: []
  max_headlines: 3
palette:
  bg_top: "#04101c"
  bg_mid: "#0b2a46"
  bg_bottom: "#123a5e"
  accent: "#35e0ff"
  text: "#ffffff"
bokeh: 24
engagement_question: "Which fact broke your brain? Comment the number."
links: []                    # add links later: [{label: ..., url: ...}]
affiliate: false
hashtags: ["#facts", "#didyouknow", "#mindblown", "#amazingfacts", "#shorts"]
music_mood: "curious"
description_cta: "Follow for a new mind-blowing fact drop every single day."
cross_promo: "More daily value on our network: @ZenithMindset | @AIChronicleNow | @WealthSignalsHQ"
daily_uploads: 1             # UNLOCKED (owner permission 2026-11-05): quota-safe
                             # default — 1 video/day/channel fits even a single
                             # SHARED GCP project (4 x 1,650 = 6,600 of 10,000).
                             # Raise to 5 (4 Shorts + 1 long-form) when this
                             # channel has its OWN GCP project/quota, or to any
                             # number in between — nothing else to change.
longform_slot: 0             # 0 = all Shorts. Set to daily_uploads to make the
                             # day's last upload a 16:9 long-form video.

title_patterns:
  - "{n} Facts About {topic} You Won't Believe"
  - "The Truth About {topic}"
  - "{n} Things You Didn't Know About {topic}"
